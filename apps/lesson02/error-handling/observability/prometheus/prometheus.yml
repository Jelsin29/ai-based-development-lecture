# Prometheus "pull" modeliyle çalışır: servislerin /metrics uç noktalarını periyodik olarak okur (scrape).
global:
  scrape_interval: 5s       # Demo için kısa tutuldu, üretimde genellikle 15s-60s
  evaluation_interval: 5s   # Alarm kurallarının değerlendirilme sıklığı

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rust-order-service
    static_configs:
      - targets: ["rust-order-service:8081"]

  - job_name: python-order-service
    metrics_path: /metrics/
    static_configs:
      - targets: ["python-order-service:8082"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
