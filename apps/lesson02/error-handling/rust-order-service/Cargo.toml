[package]
name = "rust-order-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
# Panic'lerin CatchPanicLayer tarafından yakalanabilmesi için "unwind" gereklidir.
# "abort" seçilirse panic olduğunda süreç anında sonlanır.
panic = "unwind"
